# FACE Knowledge Base Configuration
# ─────────────────────────────────
# Fill in every TODO value, then open a PR to apply.
# Your AI agent will guide you through this if you ask.
#
# Schema: ADR-KBM-007 (FACE owns intent, GitHub owns enforcement).
# CODEOWNERS and branch protection are auto-derived from the
# `admins:` and `owners.<layer>:` blocks below — never hand-edit
# .github/CODEOWNERS; edit this file instead.

kb:
  name: # TODO: Your Organisation Knowledge Base
  main_ref: main
  language: en  # Change if needed: ro, de, fr, es, etc.
  org_type: # TODO: startup | scaleup | enterprise
  # startup    → founders.md + advisors.md in 1-company/2-structure/
  # scaleup    → founders.md + advisors.md + leadership.md
  # enterprise → leadership.md + key-roles.md only

  # Optional: FACE Manager URL. When set, AI agents loading the
  # `face-kb-git` skill prefer the FACE Manager API for writes/reads
  # (per ADR-KBM-009) so commit attribution stays with the actual
  # employee instead of a shared agent identity. Leave commented out
  # for plain-git KBs not managed by FACE Manager.
  # face_manager_url: # TODO: https://face.your-domain.com

admins:
  # TODO: GitHub usernames of KB-wide admins. These people review
  # any layer + appear in CODEOWNERS as the catch-all reviewers.
  # At least one entry required.
  # - github-username

owners:
  # Per-layer reviewers. Each value can be a single GitHub username
  # (scalar) or a list (array). Use arrays when more than one
  # person should be able to approve changes for that layer.
  1-company: # TODO: GitHub username, or [user-a, user-b]
  2-departments: # TODO: GitHub username, or [user-a, user-b]
  3-products: # TODO: GitHub username, or [user-a, user-b]
  4-projects: # TODO: GitHub username, or [user-a, user-b]

# Does the reading order of the things directly inside a folder matter?
# `sequence`   — yes; the numeric prefix (`1-`, `2-`) fixes an order you chose,
#                and FACE asks for one on anything new you put there.
# `collection` — no; a numeric prefix is not required. Anything already
#                numbered keeps its number — this never renames.
#
# Below are our suggestions, not rules: a department's pages have a reading
# order, forty projects do not. Change any line that is wrong for you.
#
# Unlike `owners:` above, keys here are folder paths at ANY depth, and a line
# governs only what sits DIRECTLY inside that folder. So `2-departments:
# collection` means department folders need no numbers, and says nothing about
# the inside of a department — where `1-overview.md`, `2-processes.md`,
# `3-team.md` genuinely is a sequence, and stays one.
#
# Delete a line and FACE goes back to inferring that folder's answer from what
# is already in it. That inference is what every KB used before this existed;
# it is a reasonable guess and it is not a decision anyone made.
naming:
  2-departments: collection
  3-products:    collection
  4-projects:    collection
  5-agents:      collection

notifications:
  channel: # TODO: '#kb-updates' (Slack channel) or email@example.com
  method: slack  # Options: slack | email | teams | none

skills:
  version: "1.0"
  loaded:
    - face-kb-core
    - face-kb-write
    - face-kb-git
  # On-demand companions are NOT auto-loaded; load when the task calls for them.
  companions:
    - face-kb-decisions
